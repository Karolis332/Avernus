<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session Primer — The Lord of Slaughter, Leashed</title>
<style>
:root{
  --bg:#140f0d; --panel:#1c1512; --ink:#e9dec9; --muted:#a89a82;
  --red:#b3322c; --red-deep:#7c1d1a; --gold:#c9a14a; --blue:#6ea2d6; --line:#3a2c25;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:
  radial-gradient(1200px 600px at 70% -10%, #2a1410 0%, transparent 60%),
  var(--bg);
  color:var(--ink);
  font:17px/1.65 "Iowan Old Style","Palatino Linotype",Georgia,serif;}
#tabs{position:sticky;top:0;z-index:20;display:flex;gap:4px;align-items:flex-end;
  background:#100b09;border-bottom:1px solid var(--line);padding:9px 18px 0}
#tabs button{background:#1c1512;color:var(--muted);border:1px solid var(--line);border-bottom:none;
  padding:9px 18px;font:600 13px/1 "Iowan Old Style",Georgia,serif;letter-spacing:.04em;
  cursor:pointer;border-radius:7px 7px 0 0;transition:color .12s,background .12s}
#tabs button:hover{color:var(--ink)}
#tabs button.active{background:#2a1d17;color:var(--gold);border-color:var(--red-deep);border-bottom:1px solid #2a1d17;margin-bottom:-1px}
#wrap{display:grid;grid-template-columns:300px 1fr;max-width:1400px;margin:0 auto;}
nav{position:sticky;top:50px;align-self:start;height:calc(100vh - 50px);overflow:auto;
  padding:24px 18px;border-right:1px solid var(--line);background:#100b09;}
nav h1{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin:0 0 14px}
nav a{display:block;color:var(--muted);text-decoration:none;padding:3px 0 3px 10px;font-size:13px;border-left:2px solid transparent}
nav a:hover{color:var(--ink);border-left-color:var(--red)}
nav a.h3{padding-left:24px;font-size:12px;opacity:.78}
main{padding:42px 60px;min-width:0;max-width:920px}
h1,h2,h3,h4{font-family:"Iowan Old Style",Georgia,serif;line-height:1.2;color:#f3ead6}
main h1{font-size:33px;color:var(--red);border-bottom:2px solid var(--red-deep);padding-bottom:.3em;letter-spacing:.01em}
main h2{font-size:25px;color:var(--gold);margin-top:1.9em;border-bottom:1px solid var(--line);padding-bottom:.25em}
main h3{font-size:19px;color:var(--blue);margin-top:1.5em}
main h4{font-size:15px;color:var(--ink);text-transform:uppercase;letter-spacing:.05em}
a{color:var(--blue)}
blockquote{margin:1em 0;padding:.6em 1.1em;border-left:4px solid var(--red);
  background:#221813;color:#efe6d2;border-radius:0 6px 6px 0}
blockquote em{color:#e7d8b6}
blockquote strong{color:var(--gold)}
table{border-collapse:collapse;width:100%;margin:1.1em 0;font-size:14px}
th,td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
th{background:#2a1d17;color:var(--gold)}
tr:nth-child(even) td{background:#181210}
code{background:#241a15;color:#e7c98a;padding:1px 5px;border-radius:4px;font-size:13.5px}
pre{background:#0e0a08;border:1px solid var(--line);border-radius:8px;padding:14px 16px;overflow:auto}
pre code{background:none;color:#cdbfa6;font-size:12.5px;line-height:1.5}
hr{border:none;border-top:1px solid var(--line);margin:2em 0}
strong{color:#f6ecd6}
ul,ol{padding-left:1.4em} li{margin:.2em 0}
::selection{background:var(--red-deep);color:#fff}
@media(max-width:900px){#wrap{grid-template-columns:1fr}nav{display:none}main{padding:24px}}
</style>

# The Last Hill — Yeenoghu at the Grounded Lady Vengeance

**Mountaintop siege climax · Party Level 11 · 3 PCs + the ship's company · vs. Dumal astride a Gargantuan Yeenoghu**

> Companion to **`yeenoghu-encounter.md`** — that file holds the full statblocks (Yeenoghu, Dumal, Warden, Chain, Veska), the read-aloud pack, the Dial, and the influence meters. **This primer is the mountaintop run-sheet:** the fort, the map, the two-track engine, Jeremy's failsafes, and the upgraded weave engine. Pull deep blocks from the encounter doc as needed.
>
> **Tags:** **[CANON]** lorebook · **[HOMEBREW]** ours · **⚔️** combat · **🎲 DIAL** DM choice · **[NON-SRD]** supplied from book/knowledge.

---

## ▶ The one-breath summary

> The party **beached the Lady Vengeance on the hilltop** and dug in. Out of the red mist below climbs **Dumal, riding a Yeenoghu grown Gargantuan on a diet of hunted devils** — and the pact is bigger than a brother's obsession now: **Bhaal's grip + Mephistopheles' chain, aimed at tearing a rift and pouring the Abyss into Faerûn forever.** You can't kill a demon lord at level 11. You **break the leash** and let the two titans turn on each other, or you **overload the ship's weave engine** to rip the rift *yourself* — banishing Yeenoghu and collapsing the doom-gate in the same blast. The ship is the fort, the fort is the gun, and the gun is the bomb.

**This is a fortress-defense set-piece.** Yeenoghu is **grounded (Speed 50, no fly)** and swollen too large to scramble — he **must climb the one ridge** into the party's cannon-fire. That single fact is what makes a CR-24 survivable.

---

## ▶ What changed at the table (canon updates to fold in)

| Element | Now canon |
|---|---|
| **Battlefield** | Lady Vengeance **beached on the hilltop = the fort.** Not a flying kite — a grounded gun-emplacement redoubt. |
| **Yeenoghu's size** | **Gargantuan.** Dumal fed him powerful devils on shared hunts. Reach **20 ft**, aura **40 ft**, +Devil-Glutted (below). |
| **Dumal's thesis** | Apocalyptic. The leash exists to **tear a planar rift and drown Faerûn in Avernus.** The "save Den" wound still beats underneath — play both. |
| **The Gish** | From the Palace of Gore. **Speaks broken Common now** — can take orders, warn, banter. Githyanki spellblade → mobile Chain-cutter. |
| **The Hellriders** | **Veska** (Palace of Gore) **+ Corwin** *(rename freely)*, the second Hellrider freed in the **Bone Brambles.** Two fear-anchors now. |
| **The captain** | **Colico Jack** — current captain of the Lady Vengeance. Holds the **remote detonation relay.** |
| **The weave engine** | Jeremy finished the **3rd-level upgrade.** Baseline still 1 cannon shot per 1st-level slot; now accepts **3rd-level infusions** (hull / plating / cannon — full tables below). |

**Yeenoghu — Devil-Glutted [HOMEBREW add-on]:** he ate his way here. **HP 380** (up from 333). When any **fiend** dies within 40 ft of him, he regains **20 HP** (matters only if Unleashed — and a reason *not* to let gnolls/the Warden die next to him). Everything else = the encounter-doc block, run **Leashed/Unleashed** as written.

---

**Distance key (for grid or theatre-of-mind):**

| Feature | Size / distance | Notes |
|---|---|---|
| **The Slope** (Mist Line → Wall) | ~120 ft switchback, **difficult terrain** | Cannon range 600 ft covers all of it. Yeenoghu climbs it as the Advance track. |
| **The Wall** (chokepoint) | **40 ft wide** gap | The only breach in the hilltop rim. **Bess plants here.** A Gargantuan body barely fits — great grapple geometry. |
| **The Muster Yard** (redoubt) | ~80 ft deep | PC fighting position between the Wall and the ship. |
| **Lady Vengeance** | ~120 ft long, beached across the plateau | Cannon deck faces **down-slope (south).** AC 17, HP 350. Engine room + helm are interior sections (AC 17, 60 HP each). |
| **The Peak-Rift** | ~60 ft past the stern, higher ground | Dumal's goal. Also the point where the **overload tears the rift.** |
| **E / W / N faces** | **sheer cliffs** | Yeenoghu (no fly) cannot use them. The **Warden** (fly 40) can — it's the only enemy that reaches the deck from the sides. |

## ▶ THE CLEAN ENGINE — 3 initiative counts, 2 racing tracks

**Do not roll a turn for every ally.** Compress the whole company into one batched count so the spotlight stays on the PCs and the demon.

**Three initiative slots, total:**

| Slot | Who | How to run it |
|---|---|---|
| **The Villains** | Dumal + leashed Yeenoghu + Warden + gnolls | Encounter doc. Leashed throttle: Yeenoghu = **1 flail/round**, no Legendary Actions. |
| **The PCs** | Drenwal · Aurora · Asimov | Full turns. The interesting choices live here. |
| **The Fort** (fixed count **20**) | **ALL** allies + ship, **one batch** | Walk the station list once (~15 sec), add Strain, apply Bess. Done. |

**Two tracks are the entire fight.** Track two numbers and nothing else:

| Track | Direction | Trigger |
|---|---|---|
| **⛓ STRAIN — 0 → 200** | party pushes **up** | Leash shatters → Yeenoghu turns on Dumal → banish window. **Party wins the leash.** |
| **▲ ADVANCE — 4 zones** | Yeenoghu climbs **up** | **Mist Line → Lower Slope → The Wall → The Redoubt.** Reaching the Redoubt = he's at the ship, the fort starts falling. Beyond it lies the Peak-Rift (the apocalypse) — he only gets there if the leash never broke *and* Dumal lives to open it. |

- **Advance = 1 zone/round** base. Difficult terrain, Bess's grapple, and hard control (Sleet Storm, Slow) each shave a zone. ~4–6 rounds to the ship.
- **Strain ≈ 30–40/round** from the Fort + PC contributions. ~5–6 rounds to 200.
- **The clocks are tuned to collide at the climax.** Nudge either rate live to land the beat you want. If the players are crushing Strain, speed the Advance; if they're drowning, let Bess hold an extra round.

**Strain sources** (from `yeenoghu-encounter.md`, unchanged): radiant/force/banishment hits **+6** and deal **double** to the Chain · breaking Dumal's Reins concentration **+15** · Aether Harpoon on the Chain **+15** · unicorn beam crossing it **+10** · **Dispel Magic** shell **+40** (see infusions). Strain milestones at **100** (Yeenoghu tests the chain, free flail at Dumal) and **160** (aura flares at Dumal — GET AIRBORNE... or here, get off the Wall).

---

## ▶ THE FORT — station block (resolve all of this on count 20)

One clean action each, most contributing **flat Strain** so there's no dice-bloat. You just read down and total.

| Station | Crewed by | Clean per-round action | Feeds |
|---|---|---|---|
| **Force Cannons** ×2 | Gunner (a PC or auto) | Fire what's charged down-slope at the Chain/Yeenoghu | **+8 Strain** flat, or roll 6d10 force ×2 vs Chain |
| **Weave Engine** | **Jeremy** (or a PC) | **One** action: charge a cannon **or** run an infusion (tables below) | enables cannons / buffs the fort |
| **Bess** (Gargantuan awakened crab) | auto | Plant in the Wall, **grapple Yeenoghu's leg** (one contested STR) | On a hold: **Advance −1** this round. Your main brake. |
| **Veska** — Hellrider | auto | Hold the left flank; **fear-immunity bubble** (allies near her auto-pass frighten) + 1 radiant lance | fear anchor · **+6 Strain** |
| **Corwin** — Hellrider *(rename)* | auto | Hold the right flank; second fear bubble + 1 radiant lance | fear anchor · **+6 Strain** |
| **The Gish** | auto or a PC | Misty-step to the Chain, force/psychic strike, blink out — the Warden can't cover him | **+8 Strain** (mobile cutter) |
| **Ship Automatons** ×? | auto | Reload cannons + body-block the gnoll wave on the deck | deletes gnoll bookkeeping (soak 1 wave/round) |
| **Lulu / freed Unicorn** | auto | Radiant beam across the Chain + speaks the tutorial line | **+10 Strain** |

**Two Hellriders = two overlapping fear bubbles.** Park one near the PCs on the Wall, one on the cannon deck. Between them, Yeenoghu's fear aura, Maddening Roar, and Bhaal's Whisper mostly bounce off — which is exactly what lets a level-11 party stand on an open hilltop and keep firing.

---

## ▶ JEREMY'S FAILSAFE BRIEFING — read before initiative {#jeremy}

> *Jeremy has the party crowd into the engine room while the mist rises. He is filthy with soot and talking too fast.*

**In-character (read/paraphrase):**
> "Right — listen, because I'm only screaming this once. The Lady's grounded, so forget flying. What she *is* now is the biggest gun on this hill, and I've got her doing three things. **One:** the force cannons. Feed the weave engine a spell-charge and they fire — a first-circle charge is one shot, easy, do it all day. **Two:** I finished the third-circle work — you can pour a *proper* spell into her now and it changes what she *is* for a minute. Armor her hull, ward the deck against those Hell-things, turn a cannon-shot into a fireball or a lightning-lance. I'll show you the list, just tell me what to load. **Three—**" *(he stops)* "—three is the one nobody wants. If it all goes wrong, I overload the weave core. She tears herself apart and takes a chunk of the world's *skin* with her. That's not a cannon. That's a hole between the planes."

> "I prime it — three rounds, and I can't do anything else while I do, so you'll be down to one cannon. Once she's primed, **Captain Jack triggers her from the helm relay — remotely.** You hear that? *Remotely.* Nobody has to ride her down. Prime the core, get *off* my ship, and Jack drops the hammer from wherever you've run to." *(beat)* "The blast'll banish that thing a hundred years and — if the aim's right — it collapses whatever rift the man on the demon is trying to open. If the aim's *wrong*..." *(he doesn't finish)* "...just let me aim it."

**The three failsafes, mechanically:**

| # | Failsafe | Cost | Effect |
|---|---|---|---|
| **1** | **Force Cannon** | 1st-level slot / charge | 1 shot: +9 to hit, 600 ft, **33 (6d10) force.** Force shreds Yeenoghu's phys resist and is ×2 vs the Chain. |
| **2** | **Spell Infusion** | a prepared spell/slot fed to the engine (engine's action) | Changes the ship for **1 min or 1 use.** 2nd-or-lower = the old staples; **3rd-level = the new heavy list.** **One infusion active at a time.** |
| **3** | **Weave Overload (the nuke)** | **3-round prime** (engine locked, −1 cannon) + **Colico Jack** remote trigger | Detonation below. Banish + rift. Costs the ship. |

**Engine economy (keep it lazy-clean):** the weave engine takes **one action per round** (Jeremy or a PC). That action is **either** charge-a-cannon **or** run-an-infusion **or** commit-a-prime-round. That's the whole decision each round — nothing else to track.

## ▶ THE WEAVE ENGINE — 3rd-level infusions {#infusions}

Baseline unchanged: **1st-level slot = 1 cannon shot.** With Jeremy's upgrade, feeding a **3rd-level** spell into the engine does one of the following instead. **Only one infusion active at a time** — starting a new one ends the old. Choosing a big infusion means the cannon may sit idle that round: that's the trade.

### ⛨ PLATING — abjuration / defense

| 3rd-level spell | Ship effect | Why it matters here |
|---|---|---|
| **Protection from Energy** | **Aegis Plating** — hull gains **resistance to fire** (or a chosen type), 1 min. | Halves Yeenoghu's hellfire *and* Dumal's **Hellfire Pillar (28→14).** Highest-value defensive load. |
| **Magic Circle** | **Warded Deck** — fiends attack the ship at **disadvantage** and **cannot teleport/appear aboard**, 1 hr. | Locks the **Warden** and gnolls **off the cannon deck.** Neutralizes the one enemy that can fly to you. |
| **Counterspell** | **Null Field** — reaction, **1 use:** the engine counters one spell aimed at the ship or its crew. | Eats Dumal's Pillar or Bhaal's Whisper before it lands on the deck. |
| **Dispel Magic** | **Unmaking Pulse** — fire at the **Chain:** DC 20 check, on success **+40 Strain** (strips a binding layer). Or dispel an enemy buff. | The clever shortcut, now cannon-delivered. One good pulse ≈ a whole round of grind. |

### 🔨 HULL — structure / control

| 3rd-level spell | Ship effect | Why it matters here |
|---|---|---|
| **Sleet Storm** | **Hoarfrost Vent** — the hull exhales a 40-ft ice sheet down the Slope: difficult terrain, DC save or prone, 1 min. | **Advance −1** while it holds. Freezes Yeenoghu mid-climb — buys a whole zone. |
| **Stinking Cloud** | **Bilge Purge** — 20-ft cloud on the Slope; creatures retch (CON save or lose action). | Gnoll-wave off-switch. Clears the deck-boarders. |
| **Wall of Water** (or *Wall of Sand*) | **Barricade Weave** — raise a 30-ft wall segment at the Wall chokepoint; blocks line, halves fire damage through it. | Physically plugs the door beside Bess. Slows the Advance and shields the cannon crew. |
| **Aura of Vitality** *(reflavored)* | **Structural Weave** — the engine knits the hull: repair **2d6 hull HP** at the start of each of the ship's turns, 1 min. | Keeps the fort standing if Yeenoghu reaches the Redoubt and starts wrecking it. |

### 💥 FORCE CANNON — offense (applies to the next shot)

| 3rd-level spell | Cannon effect | Why it matters here |
|---|---|---|
| **Fireball** | **Explosive Shell** — the next shot bursts in a **20-ft radius** at impact: **+8d6 fire**, DC 15 DEX half. | Turns a single bolt into a slope-clearing AoE. Cooks the whole gnoll pack, or Yeenoghu + everything behind him. |
| **Lightning Bolt** | **Rail Shot** — the cannon fires a **100-ft line** instead of a bolt: **8d6 lightning**, DC 15 DEX half, to all in the line. | Spears Yeenoghu *and* every gnoll queued behind him on the switchback. Best when the Slope is packed. |
| **Haste** | **Rapid-Fire Servo** — the cannon fires **twice** this round (or gunner gets a second broadside), 1 min. | Doubles Strain output for the price of one engine action. Load it once the leash is close to breaking. |
| **Slow** *(fired down-slope)* | **Gravebind Round** — Yeenoghu/targets in a 40-ft cube: DC save or halved speed & actions, 1 min. | **Advance −1** *and* throttles the demon's attacks. Defensive cannon load. |

> **DM note — keep the choice sharp:** because the engine does *one* thing per round and holds *one* infusion, every load is a real decision: fire, or fortify, or freeze the climb, or prime the bomb. That single-action bottleneck is what keeps a fortress full of assets from becoming a spreadsheet.

## ▶ THE OVERLOAD — banish, rift, and Colico Jack {#overload}

The mountaintop version of the scuttle. Same engine, relocated, and now **crewed remotely** so no one has to martyr themselves.

**Prime — 3 rounds** (or faster with fuel). Jeremy (or a PC at the engine) commits the engine's action each round to priming. While priming: cannons drop to **1**, no infusions. **Burning soul coins accelerates it — each coin = −1 prime round, 3 coins = instant prime** ([soul coins](#soulcoins)). **Telegraph hard** — runes screaming, soul coins boiling in their slots, the hum climbing to a shriek. The engine room (AC 17, 60 HP) can be attacked to interrupt.

**Trigger — Colico Jack, remotely.** Once primed, **Captain Colico Jack** can detonate from the **helm relay** — and the relay reaches him **wherever he is.** Prime the core, evacuate the whole company, and Jack drops it from Bess's back / the Moonkite / halfway down the ridge. *No sacrifice play required* — that's the upgrade the party bought.

**Detonation.** Everyone aboard must be clear. The Lady Vengeance is **consumed.**
- **Blast.** 120-ft radius. DC 20 DEX: **66 (12d10) force + 33 (6d10) radiant**, half on save.
- **Weave Rupture.** The blast tears the local Weave open — **a rift between planes.** Yeenoghu (and any bound/leashed fiend in radius) makes **DC 22 CHA or is banished:** his Avernus avatar destroyed, hurled to the Abyss to **reform over 100 years** [CANON]. The **Chain shatters automatically.** Dumal, if caught, may be flung/banished too.
- **The rift — 🎲 DIAL.** The rupture is violent enough to tear a *lasting* hole. Pick the beat:
  - **Sealing blast (default):** the party's rift collapses **Dumal's doom-gate** in the same tearing — the apocalypse is unmade with the ship. Clean, heroic, expensive.
  - **Two-edged tear:** the rift banishes Yeenoghu but *stays open a moment* — something else notices the door (a future thread; Mephistopheles' Cania, a stray demon, a way home for the Gish). Bank it for later.

**Escape outs** (set at least one, or someone may choose to ride her down): **Bess** carrying riders off the peak · the **Moonkite** ferrying · the **unicorn** carrying the wounded · Aurora's **Misty Escape** · a Hellrider's steed. With Jack's **remote** trigger, a clean full evac is genuinely on the table — reward the party that sets it up.

> **Why it's not a cheap "I win":** it **costs the ship** (the party's home and gun), needs **3 rounds under fire**, only **banishes** (never kills) Yeenoghu, and the rift is a live hazard. A desperate trade that should feel like one.

*[Gondian/Baldurian arcane warship · Gargantuan vehicle (150 ft × 30 ft) · currently **beached** on the hilltop = the fort] · supersedes the brief block in `yeenoghu-encounter.md` for this fight.*

- **Armor Class** 17 · **Hull Points** 350 · **Damage Threshold** 15 *(ignore any single hit dealing < 15)*
- **Speed** 0 ft (**beached — grounded this fight**). *Airborne profile (reference): fly 40 ft / round on a consumed Fly scroll or 1 soul coin; +60 ft with Overdrive.*
- **Resist** poison, psychic · **Immune** cold (Avernus-hardened), charmed, exhaustion, frightened, paralyzed, petrified, poisoned
- **Creature Capacity** 30 crew + passengers · **Cargo** 20 tons · **Crew (minimum)** 4

**Sections (tracked separately — target these to cripple the fort):**

| Section | AC | HP | Broken effect |
|---|---|---|---|
| **Hull** (main body) | 17 | 350 | At 0: the ship is wrecked/sinking-in-place; overload auto-triggers uncontrolled (DM discretion). |
| **Weave Engine / Core** | 17 | 60 | **The crit target.** At 0: no cannons, no infusions, **overload aborts.** This is what the Warden and Dumal want dead. |
| **Force Cannon** ×2 | 18 | 40 ea | At 0: that gun is dead (lose one broadside). |
| **Helm / Bridge** (Colico Jack) | 15 | 50 | At 0: no piloting, **no remote detonation relay** (Jack must trigger from the engine in person). |
| **Aether Harpoon** | 16 | 30 | At 0: no harpoon actions. |

**Traits**
- **Weave Engine (arcane core).** Stores spell energy to run the ship. Cannons and infusions draw from it. **One engine action per round** (charge a cannon **or** run an infusion **or** commit a prime round). Upgraded to accept **3rd-level** infusions ([tables](#infusions)).
- **Soul-Fueled.** The engine burns **soul coins** as universal raw fuel — no spell slot required ([rules](#soulcoins)).
- **Beached.** Speed 0; the ship **cannot dodge or reposition** this fight. It survives on plating, infusions, and its Damage Threshold. Make the party *defend* it.
- **Damage Threshold 15.** Gnoll boarders and small hits **bounce off the hull** — they must board and strike sections/crew, not plink the ship. (Yeenoghu's flail, cannon-grade hits, and Dumal's Pillar all exceed it.)

### Ship Actions (crewed — the "Fort" acts on count 20)
The ship takes **up to 3 crew actions per round**, each requiring a living crewmember at that station. Un-crewed stations do nothing.

| Action | Station | Effect |
|---|---|---|
| **Force Cannon Broadside** | Gunner | +9 to hit, range 600 ft, **33 (6d10) force.** Two cannons = two shots (or focus one target). Requires a charge: **1st-level slot or 1 soul coin** per shot. Force = ×2 & +6 Strain vs the Chain. |
| **Aether Harpoon** | Harpooner | +9, range 120 ft. Vs **Yeenoghu:** DC 22 STR to hold (~30%). Vs the **Chain:** auto-tethers → **+15 Strain** and cannons get **advantage** next round. |
| **Weave Infusion** | Engineer | Load one spell into the ship (2nd-or-lower staple, or a **3rd-level** heavy from the [infusion tables](#infusions)). Costs the slot, **or 1 soul coin** to run it slotless. One infusion active at a time. |
| **Soul Coin Overdrive** | Captain/Engineer | Burn 1 soul coin → **one extra Cannon Broadside this round** (+60 ft fly if airborne). |
| **Prime Overload** | Engineer | Commit one of 3 prime rounds ([overload](#overload)). Soul coins accelerate this — see below. |
| **Remote Detonate** | **Colico Jack** (helm) | Once primed, trigger the detonation from the relay — **at any range**, even after full evac. (If the Helm is destroyed, Jack must trigger in person from the engine.) |
| **Batten Down** | Captain | The fort braces: ship + all crew aboard gain **+2 AC** and **resistance to one damage type** until the start of the ship's next turn. The grounded ship's substitute for evasion. |

### Soul Coins — engine fuel {#soulcoins}
The party is carrying a **hoard** of soul coins (use their current tally — the tracker last logged 3+; add any looted since). Each coin is a trapped soul the weave engine can devour as raw power.

| Burn 1 soul coin to... | Effect |
|---|---|
| **Charge a cannon** | 1 broadside, no spell slot needed |
| **Power an infusion** | run any infusion (incl. 3rd-level) with no slot |
| **Overdrive** | +1 cannon broadside this round (+60 ft fly if aloft) |
| **Accelerate the overload** | **−1 prime round** (burn 3 at once → the core primes **instantly**) |
| **Overcharge the blast** | pump the detonation yield (scaling below) |

> **The cost of feeding souls to the fire:** every soul coin *spent* is a damnation, not a resource. Each coin burned ticks **Bhaal's Claim +2** (the god of murder relishes souls spent as ammunition), and Drenwal *feels* each one go. A Bhaalspawn overloading a demon-lord bomb with a fistful of screaming coins is exactly the kind of "victory" Bhaal wants. **Let the choice cost something.**

### Overcharged Detonation — scaling the nuke with coins
Baseline overload = 3-round prime, **66 (12d10) force + 33 (6d10) radiant**, DC 22 banish, 120-ft radius ([full overload](#overload)). Coins burned *into the blast* (declared at trigger) scale it:

| Coins into the blast | Yield |
|---|---|
| **0** | Baseline. DC 22 CHA banish. Rift is controllable → **seals the doom-gate** (default Dial). |
| **1–2** | **+1d10 damage** each · DC **23** · rift leans **two-edged** (may stay ajar a moment). Bhaal +2 each. |
| **3+** | **+1d10 damage** each · DC **24** · radius **150 ft** · **the rift definitely tears** — it banishes Yeenoghu *and* spits a complication through (a stray demon, a Cania eye, a one-way door). Bhaal **+6**. |

**The design payoff:** hoarding soul coins lets the party **instant-prime and over-yield** the bomb — turning a 3-round vulnerable sequence into a single devastating trigger. But the bigger they make it, the **wilder the rift** and the **heavier the stain on Drenwal.** A clean win costs rounds; a soul-fueled win costs the world's skin and a piece of the cleric.

## ▶ The break-free 3-way fight — running it {#threeway}

When the leash shatters, this is the spectacle the whole night was built toward. Keep it fast and cinematic.

1. **Yeenoghu vs Dumal first.** Full Multiattack on the rider. The demon lord does not negotiate — it *corrects an insult.*
2. **Resolve Dumal** (the [Dial](#dial)). Smoke-and-gone, or torn apart.
3. **Yeenoghu turns on the field.** Roll him into initiative. Now he's a **full CR 24** with Legendary Actions and the gnoll-rising aura. **The party must already be leaving or detonating** — do not let them think they can now "finish" him.
4. **Recall Timer** ([aftermath](#aftermath)) — he is not here forever. Give the table the clock so the escape feels winnable, not hopeless.

**Party choices in the 3-way (all valid, all metered):**
- **Flee** on the ship while titans clash — clean exit, arc intact.
- **Bombard Yeenoghu** while he's busy with Dumal — chip the demon, risk drawing his eye.
- **Claim the kill on Dumal yourselves** instead of letting Yeenoghu do it — *very different meter & emotional outcome* (the brother dies by your hand, not the god-beast's).
- **Scuttle** to banish Yeenoghu *and* catch Dumal in the blast.
- **Save someone** — a downed PC, Jeremy, the unicorn.

## ▶ Jeremy's Gondian Overload — the nuke 💥 {#scuttle}

Jeremy (Gondian gnome — the artificers who **built the Hellships** [CANON]) can force the **weave engine** past containment: a deliberate arcane-core meltdown. The ship's already strained from the Palace; the failsafe is *right there.*

**Prime sequence — 3 rounds.** Each round Jeremy (or a PC at the engine) commits the round; the ship can still fly/fire but at **−1 cannon** while priming. **Telegraph hard:** runes screaming, soul coins boiling in their slots, the hum climbing to a shriek. The enemy can target the engine room (AC 17 section, 60 HP) to interrupt.

**Detonation (primed + triggered).** Everyone aboard must be **clear or evacuating** — the Lady Vengeance is consumed.
- **Blast.** 120-ft radius. **DC 20 DEX:** **66 (12d10) force + 33 (6d10) radiant**, half on save.
- **Weave Rupture — the demon-lord answer.** The blast tears the local Weave open: a **banishment-grade pulse.** Yeenoghu (and any bound/leashed fiend in radius) makes **DC 22 CHA or is banished** — his Avernus avatar destroyed, hurled to the Abyss to **reform over 100 years** [CANON: a demon lord "killed" off the Abyss reforms there in a century]. **The Chain shatters automatically.** Dumal, if caught, eats the blast and may be flung/banished too.
- **Cost.** The ship is **gone** — transport and a character in her own right. **Jeremy lives only if evacuated.**

**Escape outs (set at least one up, or it's a sacrifice play):** Soul Coin Overdrive ejection burst · the **Moonkite** ferrying riders · the **unicorn** carrying the wounded · Aurora's **Misty Escape** · **Veska's steed** carrying a rider clear. *If no out is arranged, someone may have to ride her down — player's choice, never forced.*

> **Why this isn't a cheap "I win":** it **costs the ship**, needs **3 rounds under fire**, and only **banishes** (never kills) Yeenoghu. It's a desperate trade, and it should feel like one.

**He dies — by the party's hand.** They pile on during the 3-way and land the kill before Yeenoghu does. *Different wound for Drenwal entirely* — he chose this, the god-beast didn't take it from him. **Bhaal −20**, and a **Coram/Gargauth** swing depending on *how* (mercy-kill vs. execution). The heaviest emotional outcome; let it land in silence.

## ▶ Read-aloud narration (DScryb-grade) {#readaloud}

*Second-person, present-tense boxed text tuned to the DScryb house voice. Read slow. Let the silences breathe.*

### (1) The Reveal
> The smog peels back like a wound deciding to open, and a man walks out of it on foot for the length of one breath — then the ground behind him rises, and you understand he was never walking. He is *riding*. Ash sifts from a coat the color of old blood. His face is your cleric's face aged ten cruel years, the same jaw, the same eyes, and he is smiling the way you smile at someone you have missed. In his fist trails a chain that hums two notes at once. "Den," he says, soft, almost grateful, and the thing beneath him lifts its three skulls to find the sound of that name.

### (2) Yeenoghu's Presence
> The stink arrives before the rest of it can — wet fur and split bone and something underneath that is just *appetite*, a smell with teeth. A cloud moves with the demon, and the cloud is flies, a living carrion haze that drinks the light and chews the air into a low electric drone. Three hyena skulls ride a body the size of a siege tower, each grin too long, each empty socket somehow watching you anyway. A three-headed flail drags furrows in the scorched rock. Where its shadow falls, your courage thins like cloth over a flame, and one ancient certainty presses flat against the inside of your ribs: *you are meat, and it has come a very long way to be fed.*

### (3) The Chain, Up Close
> Follow the leash and your eye refuses to settle, because the chain cannot decide what it is. One strand is murder given color — Bhaal's red, the deep arterial light of a killing that never finished. The other is Cania's blue, a cold so total it reads as fire, hellflame burning at the bottom of the world where heat goes to die. They braid heart to throat, the man's chest to the demon's neck, and where the two lights touch they *hate* — they spit, they spark, they recoil and lash back together. It is not a leash. It is two damnations forced to share one rope, and somewhere under the snarl you can hear it: a fine, rising whine, like glass a half-second from the crack.

### (4) The Lady Vengeance Opens Her Broadside
> The deck pitches under your boots as Jeremy throws the lever, and the *Lady Vengeance* answers from the marrow of her hull. Force-cannons run out their throats along her flank with a sound like a cathedral inhaling. Then the world goes white-loud — *crack, crack, crack* down the line — and the recoil shoves the whole ship sideways through the smog. Bolts of compressed magic carve burning seams across the red sky and slam into the carrion cloud, scattering flies in spinning black gouts. Heat washes the railing. Cordite-bright arcane stink fills your mouth. For one fierce heartbeat the smoke is lit from inside like a thunderhead, and far below, the demon does not even flinch.

### (5) The Warden of Cania Drops from the Smog
> Something detaches from the overcast and *falls* — not clumsy, deliberate, wings of frost-plated bone snapping wide to catch the air a wingspan off the deck. The temperature drops so fast your breath becomes a ghost and the rigging crackles white. A bone devil sheathed in hoarfrost armor, every spur and rib rimed in glittering ice, its segmented tail curling over its head like a question with a fatal answer. It hangs between you and the chain — *its* duty, the leash its charge — and opens a mouth that should hold no breath at all. What comes out is winter: a roaring plume of killing cold that turns the rain to needles and frosts the cannon barrels solid mid-recoil.

### (6) The Leash Strains
> The two lights in the chain are losing their war. The red surges, the blue bites back, and the whole braid convulses — and that is when you feel the demon *change its mind*. Slowly, with a grinding of vertebrae like a ship's keel breaking, the leftmost skull turns. Not toward the *Lady Vengeance*. Not toward you. It rotates backward, down its own spine, until three sockets and one long grin are aimed squarely at the man riding its shoulders. The flies go quiet. The drone drops out of the air. Dumal's grin tightens at the corners. He hauls the chain two-handed, and the red light flares to drag the skull back around — but for one held breath, Yeenoghu looked at his rider, and Yeenoghu remembered what he is.

### (7) The Leash Shatters
> The whine in the chain climbs past hearing and the braid *lets go.* Red and blue tear apart in a single white scream, hellfire and murderlight flung in opposite arcs to gutter out against the rock, and the rope falls in two dead halves. For one enormous, ringing silence nothing moves. Then all three skulls come down at once, slow, deliberate, the way a god lowers its full attention onto a single ant — and Yeenoghu looks *down* at the small soft thing that bound him, rode him, dared. Dumal's chant dies in his throat. The flies turn from a haze into a hurricane. Three hyena mouths open as one, and the sound that pours out is the oldest sound there is — and now it is no longer aimed at you.

### (8) Jeremy Primes the Overload
> "She'll only do this once!" Jeremy is already wrist-deep in the weave-engine, gnome fingers flying across runes that have started to *glow wrong* — too bright, too fast, a heartbeat racing toward a stroke. The deck shudders. Down in the hull the contained magic that flies this ship begins to eat itself, and you hear it as a rising chord that climbs and will not stop climbing, every plate in the *Lady Vengeance* singing one ascending note of strain. Steam screams from her seams. The sigils smoke under his hands. Lulu's trumpet sounds a warning peal, high and bright and afraid. Jeremy looks back at you once, soot-black, eyes wide, and grins like a man lighting the last match in the world. "*Hold on to something.*"

### (9) The Detonation
> The note the ship has been climbing finally breaks — and the *Lady Vengeance* becomes a sun. There is no sound first, only light, a soundless white that erases the sky and prints the bones of your own hands across your eyes. Then the noise arrives all at once and shoves the air out of the world; the shockwave hits like a god's open palm and the heat comes behind it in a single rolling wall. At the heart of the glare the weave tears open — a ragged wound in the air itself, edges peeling into somewhere that is *not here* — and through it the demon is *dragged*, three skulls thrown back, the whole Gargantuan bulk of Yeenoghu folding sideways into the rift like water down a drain. The Abyss takes him. The light closes its fist. Then darkness, ringing, and the slow falling ash.

### (10) Aftermath A — Dumal Escapes in Bhaal Smoke
> When your sight crawls back, the field is a graveyard of glowing embers and your brother is on his knees in the middle of it. The demon is gone. The chain is gone. Everything he sold his soul to ride has been ripped out of his hands, and Dumal — the Flame Ascendant, the man who burned a whole self to chase this — simply kneels in the cinders and *looks* at you. Not with hate. With something far worse, and far more familiar. Red smoke begins to rise from the ground around him, Bhaal's own mercy come to carry its child away. "I'd have shared it with you," he says, almost gentle, almost a boy again. "All of it. *Den.*" The smoke folds over him like a closing hand, and where your brother knelt there is only scorched stone and the smell of someone you used to love.

### (11) Aftermath B — Dumal Slain by Yeenoghu
> You see it happen and you will see it for the rest of your life. In the instant before the rift takes him, Yeenoghu does not flee — he *reaches*, one ruined hand closing around the small kneeling shape of the man who chained him, and he does not bother with the flail. He simply *closes his fist.* There is no scream. There is no time for one. What was your brother becomes a single wet sound and a fine red mist that the carrion flies take with them into the dark, and then the Abyss swallows demon and remnant and all. The ash settles. Somewhere in it is a man who shared your blood and your father's curse and, once, a childhood — and there is not enough of him left to bury. The field goes quiet. You are still holding your weapon. There is nothing left to point it at.

### (12) Aftermath C — The Quiet
> The smoke thins by degrees, the way a fever finally breaks, and the red goes out of the sky one shade at a time. The carrion drone is gone. The cannons have stopped. Even the embers are surrendering their light, winking out across the black field one by one until the silence is total enough to hear your own pulse slowing in your ears. Wreckage of the *Lady Vengeance* ticks and cools somewhere behind you. Lulu's wings make a small, exhausted sound. And then, high overhead, the perpetual murk of Avernus parts just wide enough to show a single point of light — not a fire, not a spell, just one cold and distant star that has no business existing in this place. You stand in the ash and look up at it, and for the first time in a very long time, nothing is trying to kill you.

## ▶ DM combat reference card {#refcard}

### Balance audit — the one fix that matters
**The original Chain numbers (Integrity 90 / Strain 100 / +10 per hit / +1 per 5 dmg) shatter the leash at the end of Round 1 by ~3×** — a full-party volley dumps ~117 Strain and ~300 Integrity damage in a single round, handing the party an *unleashed CR 24* right after they've spent their alpha strike on the Chain. TPK setup, not a 4-round set-piece. **Corrected values (already applied to the [Chain block](#chain)):** Integrity **300** (backstop only), Strain ceiling **200**, **+6** per radiant/force/banishment hit, **+1 per 8** Integrity damage, milestones **100 / 160 / 200**. With realistic *split* fire (≈2 cannons + unicorn + 1 striker on the Chain while the rest handle Yeenoghu / the Warden / gnolls) the leash now breaks **Round 4–5.** Two locks that keep the unleash from being a wipe: **Yeenoghu has no fly in BOTH modes** (canon — a grounded demon lord cannot chase the airborne ship), and **telegraph the shatter at Strain 160** so everyone can climb. The unleash becomes a *get-airborne sprint*, not a TPK.

> **Survivability (leashed, ~4 rounds):** sustained incoming ≈ 55/round vs ~40 healing (Drenwal + Lulu + unicorn) across ~335 front-line HP + the 350-HP ship — net ~15/round, fine. Expect **one knockdown** on the R3 spike (Yeenoghu flail + Dumal's Hellfire Pillar + Warden Hoarfrost on one body ≈ 80). That's drama, not a wipe. **Warden** (189 HP, AC 21) dies to focused cannon fire in ~1.5 rounds — its job is the once-per-round Interposition *tax*, not a sponge; don't buff it. **Scuttle:** Jeremy's engine room (AC 17 / 60 HP) survives the 3-round prime *if* the party screens 3+ gnolls away from it.

### Suggested initiative order
1. **Lady Vengeance gunners** (cannons top-of-round — highest impact)
2. **Aurora + Moonkite** (flying, radiant, mobile)
3. **Veska** (Hellrider — frontline striker / frighten-anchor)
4. **Dumal** (concentration on the Reins must be threatened)
5. **Asimov** (Soulknife — reactive sneak-attack positioning)
6. **Warden of Cania** (Reaction window covers most PC turns)
7. **Yeenoghu (leashed)** (one flail, frighten)
8. **Drenwal** (heal *after* seeing the round's damage)
9. **Gnolls** (R2–R4)
10. **Unicorn / Lulu** (support, beam-cross the Chain)

### Round-by-round villain script
- **R1 — establish the wall.** Warden positions within 10 ft of the Chain, **holds Interposition** for the biggest incoming hit. Yeenoghu: flail the nearest striker (frighten DC 20), no legendary actions. Dumal: maintain Reins, drop a control/force effect on the deck. No gnolls yet.
- **R2 — pressure the healer.** Yeenoghu: flail **Drenwal** (tax the heal economy). Dumal: ranged force at Aurora/Moonkite (knock the flyer). **2–4 gnolls board.** Warden: Hoarfrost the gunners if recharged, else hold redirect.
- **R3 — the spike.** Dumal: **Hellfire Pillar** (8d6, ignores fire resist) on the densest cluster — spend it here. Yeenoghu: flail the lowest PC. **Remaining gnolls land** (up to 8). *Watch the "too hard" dial if a PC is about to die unfairly.*
- **R4 — the break approaches.** Strain crosses **160** → **narrate the chain shrieking, Lulu screams the warning.** Dumal at ≤60 HP tries **Bhaal Smoke retreat** — *only works if the leash still holds.*
- **R5 / SHATTER (Strain 200 or Integrity 0).** **UNLEASHED.** Yeenoghu's first action: turn on **DUMAL**, Multiattack (240 HP → dead in 1–2 rounds). Unleash window **1d4+1 rounds**, **grounded** — party objective flips to **ESCAPE** (climb, Overdrive +60 ft, Misty Step up, Moonkite swoop, unicorn Teleport 1/day/1 mile). Anyone still adjacent to the wreck eats a ~80 multiattack.

### Leash-Strain tracker
```

[ ]  +6  per radiant / force / banishment HIT on the Chain
[ ]  +1  per 8 raw damage to Chain Integrity
[ ] +15  break Dumal's Reins concentration (CON DC 10)
[ ] +15  Aether Harpoon bites the Chain

MILESTONES
[ ] 100  ► Yeenoghu free-swings at DUMAL (telegraph — he's slipping the leash)
[ ] 160  ► AURA FLARES on Dumal (LOUD telegraph: "GET AIRBORNE")

```

### Win-condition checklist
```
[ ] Warden of Cania down (clears Interposition)          — target R1–R2
[ ] Dumal's Reins broken OR Dumal ≤60 HP                  — +15 Strain, stops his retreat
[ ] Strain ≥ 200  OR  Chain Integrity 0                   — LEASH SHATTERS
[ ] Yeenoghu unleashed onto Dumal (not the party)
[ ] Jeremy completes 3-round engine prime (scuttle armed) — if going nuclear
[ ] ALL crew airborne / aboard before or at shatter
[ ] Escape the unleash window (1d4+1 rnds) — flight / Overdrive / Teleport
WIN = leash shattered + Dumal consumed/dead + ship escapes with crew alive
```

### "Too hard / too easy" dial
**Too hard** (party wrecked / unfair PC death): drop Yeenoghu's flail force-rider (27→17); cut gnolls to 4, delay to R3; Warden Hoarfrost the **ship** (350 HP), never a PC; Hellfire Pillar → 6d6 or skip if a PC is low; roll the unleash window at minimum and make Yeenoghu's first unleashed turn a **roar (no attack)** — a free escape round; lower Strain-to-break 200 → 150.
**Too easy** (Chain melting): raise Strain 200 → 260, Integrity → 400; Warden +50 HP and Interpose the **cannon** every round; Dumal reaction-negates one Harpoon bite and keeps Reins up; add a 2nd Warden or 8 gnolls from R1; Yeenoghu gets **2** leashed flails; unleash window 1d6+1 + a one-time 30-ft **Abyssal Leap** to the low-hovering ship.

**Core levers, by impact:** (1) Strain ceiling = pacing · (2) Warden redirect target = how much Chain damage lands · (3) Yeenoghu flail force-rider = PC lethality · (4) unleash window length + no-fly = escape safety.

## ▶ Boss-fight design audit (7-step framework) {#audit}

A pass over this encounter against the 7-step boss-design checklist. **✓** = already in the primer · **➕** = gap closed below.

1. **A boss worth the name** ✓ — Dumal is *integral* (the player's own brother), has a clear motive (drag "Den" home and "save" him by remaking him), a personality that escalates, and a stand-out kit (riding a demon lord on a soul-bought leash). Yeenoghu is the spectacle; **Dumal is the heart.**
2. **Stakes, personal** ✓ — it's Drenwal's brother, sold to Mephistopheles; plus the **Senna** thread and the **Bleeding-Citadel clock.** The reason to fight is family and the cure, not loot.
3. **An environment that changes** ➕ — see the **battlefield-state ladder** below.
4. **Phases with different tactics** ✓ — leashed grind → strain telegraphs → **UNLEASHED 3-way** → escape/scuttle. Each plays differently (round script in the [reference card](#refcard)).
5. **Everyone gets a spotlight** ➕ — see the **spotlight matrix** below.
6. **The boss feels real start-to-finish** ➕ — see the **75/50/25% ladder** below (sequences the [quote lines](#quotes)).
7. **Aftermath beyond gold** ➕ — see **rewards & world-reaction** below.

### ➕ Battlefield states (step 3) — the field mutates each phase
- **Opening — the Demon Zapper wreck & gore-plain.** The unicorn's torn cage, the dao's collapsed tunnel, open red flat. *Lady Vengeance* overhead. (Map A.)
- **Mid — smog & swarm.** Yeenoghu's carrion-fly cloud thickens (lightly obscured); gnolls boil up and board; the unicorn's radiance carves a clean-air pocket; bone-stone is difficult footing. (Map B.)
- **Strain ≥160 — the leash flares.** Red-and-cobalt light floods the field, the fly-drone cuts out, the demon's attention visibly swings to Dumal. *The telegraph the whole table feels.*
- **UNLEASH — the rift forms.** A forming Abyssal tear warps the ground; the gnoll-rising aura turns the slain into more gnolls; the field becomes a **"get airborne or die" zone.** (Map C.)
- **Scuttle — white annihilation.** The weave-rupture bleaches everything; after: scorched glass, falling ash, the single star.

### ➕ Spotlight matrix (step 5) — one tailored beat per PC
| PC | Their moment |
|---|---|
| **Drenwal** | The *only* one Dumal speaks to; Bhaal's Whisper targets him; the moral fork (let Yeenoghu take Dumal / claim the kill / save him). Radiance is a prime leash-cutter. **Emotional spotlight, not just mechanical.** |
| **Aurora** | Moonbow (radiant) + 1/rest **Banishment** both hit the Chain for *double* — she's the designated **leash-cutter**; the Moonkite keeps her airborne to pick the braid apart. "Your light is the thing it can't stand." |
| **Asimov** | Give him the **Warden** (a devil with a soul to claim) and the dao's **soul-coins** in the wreck; his force/psychic burst chips the Chain; a "consume a falling gnoll" beat. |
| **Veska** | A **true Hellrider** facing a fallen one — her spotlight is the order's reckoning with Dumal (let her call out his broken oath). Mechanically the **frighten-anchor** (her Oath aura blunts Yeenoghu's fear) and a **fiend-striker** whose blessed lance is magical + radiant — she holds the deck against gnoll boarders and can chip the Chain in melee if she reaches it. |
| **Lulu** | The **tutorial voice** ("cut the leash, let them tear each other apart") + radiant support — the reason the party knows the win-condition at all. |
| **Jeremy** | The **scuttle** is his — the engineer's sacrifice/heroics at the weave-engine. |

### ➕ The boss at 75 / 50 / 25% (step 6)
**Dumal (240 HP) — boast → anger → fear:**
- **100–75% — boasting/loving:** the leash holds; theatrical, certain, calls him "Den."
- **~50% — cracks:** hauling the chain two-handed; anger at the party for "making me hurt you"; spends **Hellfire Pillar.**
- **~25% / high Strain — fear:** the real brother surfaces — *"it's looking at me, I can't hold it."* Bhaal Smoke retreat **only if the leash still holds.**

**Yeenoghu — leashed → turning → unleashed:**
- **Leashed:** broadcasts hunger + contempt for the "flea" on his neck.
- **Strain 100/160:** broadcasts dawning rage; tests the chain against Dumal.
- **Unleashed:** **RIP AND TEAR** — turns on the rider, then the field. *(Cue Vorpal Lance's "Yeenoghu: Rip and Tear.")*

### ➕ Aftermath — rewards beyond gold (step 7)
- **A Bleeding-Citadel component:** Yeenoghu's ichor / a flail-shard / the cooled leash-slag — top-tier *demon-lord blood* Blood-Pay material. Ties straight into the main quest clock.
- **Mephistopheles' ledger (new thread):** the party cost Cania its asset → an archdevil now holds an *interest* in them — a future boon-or-bounty.
- **The freed unicorn** → a celestial ally and a possible *"untouched god's" witness* for Drenwal's rebirth-cure.
- **Reputation:** *the crew that banished a demon lord in Avernus.* Bel respects it; the Wandering Emporium hears of it; gnoll-warbands fear the ship. A working legend-name: **"the Leash-Breakers."**
- **Personal fallout (Drenwal):** the brother's fate seeds the **Senna** arc — dead (cult/Mephistopheles fallout) or alive (more dangerous, more breakable).
- **The cost:** if they scuttled, they're **grounded in Avernus** without the *Lady Vengeance* — the next session opens on that problem.
